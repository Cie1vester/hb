<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>♡ Happy Birthday, My Wife ♡</title>
<meta name="description" content="A tiny pixel birthday game, from Syl with love.">
<meta name="theme-color" content="#2b1f3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎂%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ══ the pixel stage ══ -->
  <div id="stage">
    <canvas id="game" width="320" height="180" aria-label="A cosy pixel room where Syl brings his wife a birthday cake"></canvas>
    <button id="mute" type="button" title="Toggle music" aria-label="Toggle music">♪</button>
    <div id="toast" role="status"></div>
  </div>

  <!-- ══ the dialogue box ══ -->
  <div id="dialog" hidden>
    <div id="nameplate"><span id="speaker"></span></div>
    <div id="body">
      <p id="text"></p>
      <div id="choices" role="group" aria-label="Choose your reply"></div>
      <div id="advance" aria-hidden="true">▼</div>
    </div>
  </div>

  <!-- ══ hold-to-blow control ══ -->
  <div id="blowbar" hidden>
    <button id="blow" type="button">HOLD TO BLOW</button>
    <div id="meter"><i></i></div>
  </div>

  <!-- ══ finale buttons ══ -->
  <div id="finale" hidden>
    <button class="pxbtn" id="openLetter" type="button">💌 Syl's note</button>
    <button class="pxbtn" id="hugBtn" type="button">🎀 Hug her</button>
    <button class="pxbtn ghost" id="replay" type="button">↺ Play again</button>
  </div>

</div>

<!-- ══ title screen ══ -->
<div id="title">
  <div class="sparkles" aria-hidden="true"></div>
  <p class="sup">★ ｡ ･ ﾟ a tiny pixel game ﾟ･ ｡ ★</p>
  <h1>Happy Birthday<span>My Wife</span></h1>
  <p class="sub">from a certain someone in a brown beret<br>who has been awake since 4am</p>
  <button class="pxbtn big" id="start" type="button">▶ PRESS START</button>
  <p class="hint">best with sound on ♪</p>
</div>

<!-- ══ letter overlay ══ -->
<div id="letterWrap" hidden>
  <div id="letter" role="dialog" aria-modal="true" aria-label="A note from Syl">
    <h2>♡ for my wife ♡</h2>
    <div id="letterText"></div>
    <button class="pxbtn" id="closeLetter" type="button">close ♡</button>
  </div>
</div>

<script src="js/sprites.js"></script>
<script src="js/scene.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/script.js"></script>
<script src="js/main.js"></script>
</body>
</html>
